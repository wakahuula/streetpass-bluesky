name: Release

# Push a tag like v0.2.0 to publish a release. The tag has to match the
# version in package.json, which also ends up in both manifests.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag against package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Zip builds
        run: |
          version=${GITHUB_REF_NAME#v}
          for browser in chrome firefox; do
            # Zip from inside the folder: the stores want manifest.json at the root.
            (cd "artifacts/streetpass-bluesky-$browser" && zip -qr "$GITHUB_WORKSPACE/streetpass-bluesky-$browser-$version.zip" .)
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" streetpass-bluesky-*.zip --generate-notes --verify-tag
